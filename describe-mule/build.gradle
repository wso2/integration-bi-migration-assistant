plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.11'
}

group 'com.wso2'
version '0.1.0-SNAPSHOT'

// Mule 4 adapter for --describe. `mule` uses common and raml-to-openapi as implementation dependencies,
// so they are not visible here unless declared.
dependencies {
    implementation project(path: ':mule')
    implementation project(path: ':describe-model')
    implementation project(path: ':common')
    implementation project(path: ':raml-to-openapi')
    implementation group: 'org.jetbrains', name: 'annotations', version: "${jetbrainsAnnotationsVersion}"

    testImplementation group: 'org.testng', name: 'testng', version: "${testngVersion}"
    testImplementation group: 'com.networknt', name: 'json-schema-validator', version: '1.5.6'
    // UnchangedConversionTest prints the generated Ballerina code, as the mule tests do
    testImplementation group: 'org.ballerinalang', name: 'ballerina-parser', version: "${ballerinaLangVersion}"
    spotbugs group: 'com.github.spotbugs', name: 'spotbugs', version: "${spotbugsVersion}"
}

checkstyle {
    toolVersion = '10.12.5'
    config = resources.text.fromUri('https://raw.githubusercontent.com/wso2/code-quality-tools/v1.4/checkstyle/jdk-17/checkstyle.xml')
}

spotbugs {
    reportLevel = 'high'
    excludeFilter = file("${rootProject.projectDir}/spotbugs-exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }
    // Assertions stay on for the describe code but are off for the mule converter, as in the CLI. An upstream
    // assert in the DataWeave converter fails on some real projects.
    jvmArgs '-da:mule...'
    // UnchangedConversionTest reads the test files of the mule module, and :mule:test deletes and rewrites some
    mustRunAfter ':mule:test'
    // -Ddescribe.projects.dir=<folder> also checks the Mule 4 projects in that folder; without it those tests skip
    systemProperty 'describe.projects.dir', providers.systemProperty('describe.projects.dir').getOrElse('')
}

build {
    dependsOn checkstyleMain
    dependsOn spotbugsMain
}
