plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.5.11'
}

group 'com.wso2'
version '0.1.0-SNAPSHOT'

dependencies {
    // RAML Parser
    implementation "org.raml:raml-parser-2:${ramlParserVersion}"

    // OpenAPI Model & Parser
    implementation "io.swagger.parser.v3:swagger-parser:${swaggerParserVersion}"
    implementation "io.swagger.core.v3:swagger-models:${swaggerModelsVersion}"
    implementation "io.swagger.core.v3:swagger-core:${swaggerCoreVersion}"

    // YAML Processing
    implementation "com.fasterxml.jackson.core:jackson-databind:${fasterXmlVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${fasterXmlVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${fasterXmlVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Utilities
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"
    implementation "commons-io:commons-io:${commonsIoVersion}"

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.skyscreamer:jsonassert:${jsonassertVersion}"
    spotbugs group: 'com.github.spotbugs', name: 'spotbugs', version: "${spotbugsVersion}"
}

checkstyle {
    toolVersion = '10.12.5'
    config = resources.text.fromUri('https://raw.githubusercontent.com/wso2/code-quality-tools/v1.4/checkstyle/jdk-17/checkstyle.xml')
}

spotbugs {
    reportLevel = 'high'
    excludeFilter = file("${rootProject.projectDir}/spotbugs-exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

test {
    useJUnitPlatform()
}

build {
    dependsOn checkstyleMain
    dependsOn spotbugsMain
}
